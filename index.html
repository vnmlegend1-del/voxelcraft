  }
  window.startDuel = startDuel;
  function endDuel(won) {
    duelActive = false;
    if (duelBot && duelBot.model) {
      scene.remove(duelBot.model);
      remotePlayers.delete(duelBot.id);
      duelBot = null;
    }
    if (won) addChatLine('Duels', 'YOU WIN! Returning to lobby spawn area...');
    else addChatLine('Duels', 'Defeat. Inventory lost.');
  }
  function updateDuelBot(dt) {
    if (!duelActive || !duelBot || duelBot.hp <= 0) {
      if (duelActive && duelBot && duelBot.hp <= 0) {
        addChatLine('Duels', 'BOT defeated!');
        endDuel(true);
      }
      return;
    }
    const d = Math.min(0.05, dt || 0.016);
    const st = duelBot.st;
    const groundY = duelGroundY();

    // Gravity always
    duelBot.vy -= 32 * d;
    if (duelBot.vy < -50) duelBot.vy = -50;
    // Horizontal damp
    duelBot.vx *= Math.pow(0.82, d * 60);
    duelBot.vz *= Math.pow(0.82, d * 60);
    if (Math.abs(duelBot.vx) < 0.02) duelBot.vx = 0;
    if (Math.abs(duelBot.vz) < 0.02) duelBot.vz = 0;

    // Chase player (XZ only)
    const dx = playerPos.x - duelBot.x;
    const dz = playerPos.z - duelBot.z;
    const dist = Math.hypot(dx, dz) || 1;
    // stay inside 50x50 ring
    const adx = duelBot.x - duelArena.cx, adz = duelBot.z - duelArena.cz;
    const arenaR = (duelArena.size / 2) - 1.5;
    if (Math.hypot(adx, adz) > arenaR) {
      duelBot.vx -= (adx / (Math.hypot(adx, adz) || 1)) * 14 * d;
      duelBot.vz -= (adz / (Math.hypot(adx, adz) || 1)) * 14 * d;
    } else if (dist > 1.15) {
      duelBot.vx += (dx / dist) * st.speed * d * 10;
      duelBot.vz += (dz / dist) * st.speed * d * 10;
    }

    // Integrate
    duelBot.x += duelBot.vx * d;
    duelBot.z += duelBot.vz * d;
    duelBot.y += duelBot.vy * d;

    // HARD snap to arena floor — never float, never fall through
    if (duelBot.y <= groundY + 0.05) {
      duelBot.y = groundY;
      duelBot.vy = 0;
      duelBot.onGround = true;
    } else {
      duelBot.onGround = false;
    }
    // if somehow way above (knockback glitch), pull down fast
    if (duelBot.y > groundY + 6) {
      duelBot.y = groundY;
      duelBot.vy = 0;
    }

    // face player + model
    if (duelBot.model) {
      duelBot.model.position.set(duelBot.x, duelBot.y, duelBot.z);
      duelBot.model.rotation.y = Math.atan2(dx, dz);
    }
    if (duelBot.flash > 0) {
      duelBot.flash -= d;
      duelBot.model && duelBot.model.traverse(o => {
        if (o.isMesh && o.material && o.material.color) {
          if (!o.userData._base) o.userData._base = o.material.color.getHex();
          o.material.color.setHex(duelBot.flash > 0 ? 0xff3333 : o.userData._base);
        }
      });
    }
    // Attack player — aim % decides if the punch lands (harder = better aim)
    duelBot.hitCd = Math.max(0, duelBot.hitCd - d);
    if (dist < st.range && Math.abs(playerPos.y - duelBot.y) < 2.2 && duelBot.hitCd <= 0) {
      duelBot.hitCd = st.hitCd;
      const aim = (st.aim != null) ? st.aim : 0.7;
      if (Math.random() <= aim) {
        if (gameMode !== 'creative' && !isSpectating && !isDead) {
          playerHealth = Math.max(0, playerHealth - 4); // fixed 4 dmg
          playerVel.x += (dx / dist) * 5.5;
          playerVel.z += (dz / dist) * 5.5;
          playerVel.y = Math.max(playerVel.y, 2.8);
          playSound('hit');
          spawnParticles(playerPos.x, playerPos.y + 1, playerPos.z, 0xff3333, 8);
          if (typeof updateHeartsUI === 'function') updateHeartsUI();
          if (playerHealth <= 0) triggerDeath();
        }
      }
      // miss: still consumes cooldown (swung and missed)
    }
    // sync remotePlayers
    const e = remotePlayers.get(duelBot.id);
    if (e) { e.data.x = duelBot.x; e.data.y = duelBot.y; e.data.z = duelBot.z; e.data.hp = duelBot.hp; }
  }


  setTimeout(() => { try { spawnTestBot(); } catch (e) { console.warn('TEST bot', e); } }, 800);

  function applyNetworkBlock(x, y, z, type) {
    setBlock(x, y, z, type);
    updateInstancedWorld();
  }

  function sendNetworkBlock(x, y, z, type) {
    if (!multiplayerSocket || multiplayerSocket.readyState !== WebSocket.OPEN) return;
    multiplayerSocket.send(JSON.stringify({
      type: 'block',
      x: Math.floor(x),
      y: Math.floor(y),
      z: Math.floor(z),
      block: Math.floor(type)
    }));
  }

  function sendNetworkChat(text) {
    if (!multiplayerSocket || multiplayerSocket.readyState !== WebSocket.OPEN) return;
    multiplayerSocket.send(JSON.stringify({ type: 'chat', text: String(text).slice(0, 120) }));
  }

  function sendNetworkPosition(force = false) {
    if (!multiplayerSocket || multiplayerSocket.readyState !== WebSocket.OPEN) return;

    const now = performance.now();
    const current = {
      x: Number(playerPos.x.toFixed(2)),
      y: Number(playerPos.y.toFixed(2)),
      z: Number(playerPos.z.toFixed(2)),
      yaw: Number(yaw.toFixed(3)),
      pitch: Number(pitch.toFixed(3))
    };

    if (!force && multiplayerLastSent) {
      const moved =
        Math.hypot(current.x - multiplayerLastSent.x, current.z - multiplayerLastSent.z) > 0.08 ||
        Math.abs(current.y - multiplayerLastSent.y) > 0.08 ||
        Math.abs(current.yaw - multiplayerLastSent.yaw) > 0.02;

      if (!moved && now - multiplayerMoveTimer < 1000) return;
      if (now - multiplayerMoveTimer < 500) return;
    }

    multiplayerMoveTimer = now;
    multiplayerLastSent = current;
    multiplayerSocket.send(JSON.stringify({ type: 'move', ...current }));
  }

  function handleMultiplayerMessage(event) {
    let msg;
    try { msg = JSON.parse(event.data); } catch { return; }

    if (msg.type === 'welcome') {
      multiplayerId = msg.id;
      multiplayerConnected = true;

      for (const p of msg.players || []) {
        if (p.id !== multiplayerId) makeRemotePlayer(p);
      }

      for (const b of msg.blocks || []) {
        setBlock(b.x, b.y, b.z, b.block);
      }
      updateInstancedWorld();

      if (msg.name && msg.name !== playerName) {
        playerName = msg.name;
        refreshNameUI();
      }

      addChatLine('Server', 'Multiplayer connected! Everyone is in the same world.');
      sendNetworkPosition(true);
      return;
    }

    if (msg.type === 'join') {
      makeRemotePlayer(msg.player);
      addChatLine('Server', (msg.player?.name || 'Player') + ' joined the world.');
      return;
    }

    if (msg.type === 'leave') {
      const p = remotePlayers.get(msg.id);
      if (p) addChatLine('Server', (p.data?.name || 'Player') + ' left the world.');
      removeRemotePlayer(msg.id);
      return;
    }

    if (msg.type === 'move') {
      updateRemotePlayer(msg.player);
      return;
    }

    if (msg.type === 'block') {
      applyNetworkBlock(msg.x, msg.y, msg.z, msg.block);
      return;
    }

    if (msg.type === 'chat') {
      addChatLine(msg.name || 'Player', msg.text || '');
      return;
    }
    if (msg.type === 'admin_tp') {
      // Server/peer told us to teleport here
      if (msg.x != null) {
        pendingTeleport = { x: msg.x, y: msg.y, z: msg.z, t: 0.3 };
        addChatLine('System', 'You were teleported.');
      }
      return;
    }
    if (msg.type === 'admin_fly') {
      if (msg.pass === 'emiroyun') {
        isFlying = !!msg.on;
        addChatLine('System', isFlying ? 'Fly enabled.' : 'Fly disabled.');
      }
      return;
    }
    if (msg.type === 'admin_give') {
      if (msg.item) {
        addToInventory(msg.item, msg.count || 1);
        addChatLine('System', 'Received ' + (msg.count || 1) + 'x ' + msg.item);
      }
    }
    if (msg.type === 'tpa_request') {
      if ((msg.to || '').toLowerCase() === (playerName || '').toLowerCase()) {
        pendingTpaIn = { from: msg.from, t: performance.now() };
        addChatLine('System', (msg.from || '?') + ' requested to teleport to you. /tpaccept or /tpdeny');
      }
      return;
    }
    if (msg.type === 'tpa_accept') {
      // requester receives coords of accepter
      if ((msg.from || '').toLowerCase() === (playerName || '').toLowerCase()) {
        pendingTeleport = { x: msg.x, y: msg.y + 0.5, z: msg.z, t: 1 };
        addChatLine('System', (msg.to || 'Player') + ' accepted your TP.');
      }
      return;
    }
    if (msg.type === 'tpa_deny') {
      if ((msg.from || '').toLowerCase() === (playerName || '').toLowerCase()) {
        addChatLine('System', (msg.to || 'Player') + ' denied your TP.');
      }
      return;
    }
    if (msg.type === 'admin_kill') {
      if (msg.pass === 'emiroyun') { playerHealth = 0; triggerDeath(); addChatLine('System', 'You were killed by admin.'); }
      return;
    }
    if (msg.type === 'admin_invisible') {
      if (msg.pass === 'emiroyun') {
        isInvisible = !isInvisible;
        if (typeof steve !== 'undefined' && steve) steve.visible = !isInvisible && camMode !== 0;
        addChatLine('System', isInvisible ? 'Invisible ON' : 'Invisible OFF');
      }
      return;
    }
    if (msg.type === 'hit') {
      // Someone hit us — apply damage + knockback (survival only)
      if (gameMode === 'creative' || isFlying) return;
      const dmg = Math.max(1, Math.floor((msg.dmg || 4) * (1 - (typeof armorProtection === 'function' ? armorProtection() : 0))));
      playerHealth = Math.max(0, playerHealth - dmg);
      playerVel.x += (msg.kbX || 0);
      playerVel.y += (msg.kbY || 3);
      playerVel.z += (msg.kbZ || 0);
      playSound('hit');
      spawnParticles(playerPos.x, playerPos.y + 1, playerPos.z, 0xff3333, 10);
      addChatLine('PvP', 'You were hit for ' + dmg + '!');
      if (playerHealth <= 0) triggerDeath();
    }
  }

  function connectMultiplayer() {
    if (multiplayerSocket &&
        (multiplayerSocket.readyState === WebSocket.OPEN ||
         multiplayerSocket.readyState === WebSocket.CONNECTING)) return;

    if (!/^wss?:\/\//i.test(MULTIPLAYER_SERVER) ||
        MULTIPLAYER_SERVER.includes('YOUR-WORKER')) {
      addChatLine('Server', 'Local single session — set ?server=wss://YOUR-WORKER for real multiplayer.');
      // Still allow local play; remote players need a Worker URL
      return;
    }

    try {
      multiplayerSocket = new WebSocket(MULTIPLAYER_SERVER + '?room=main');

      multiplayerSocket.addEventListener('open', () => {
        multiplayerSocket.send(JSON.stringify({
          type: 'hello',
          name: playerName,
          x: playerPos.x,
          y: playerPos.y,
          z: playerPos.z,
          yaw,
          pitch
        }));
      });

      multiplayerSocket.addEventListener('message', handleMultiplayerMessage);

      multiplayerSocket.addEventListener('close', () => {
        multiplayerConnected = false;
        for (const id of Array.from(remotePlayers.keys())) removeRemotePlayer(id);
        addChatLine('Server', 'Multiplayer disconnected. Reconnecting...');
        setTimeout(connectMultiplayer, 2500);
      });

      multiplayerSocket.addEventListener('error', () => {
        multiplayerConnected = false;
      });
    } catch (err) {
      console.error('Multiplayer connection error', err);
    }
  }

  // Hook name confirm to refresh sprite

  // Camera perspective: 0 = 1st person, 1 = 3rd back, 2 = 3rd front (Minecraft F5 style)

  // Subscriptions for block selection

  // Particle Pool (Block Debris & Combat Hits)
  const MAX_PARTICLES = 10;
  const particleGeo = new THREE.BoxGeometry(0.08, 0.08, 0.08);
  const particlePool = [];
  for (let i = 0; i < MAX_PARTICLES; i++) {
    const pMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
    const pMesh = new THREE.Mesh(particleGeo, pMat);
    pMesh.visible = false;
    scene.add(pMesh);

  }

  function spawnParticles(x, y, z, colorHex, count = 8) {
    let spawned = 0;
    for (let i = 0; i < MAX_PARTICLES && spawned < count; i++) {
      const p = particlePool[i];
      if (!p.mesh.visible) {
        p.mesh.visible = true;
        p.mesh.position.set(x, y, z);
        p.mat.color.setHex(colorHex);
        p.vx = (Math.random() - 0.5) * 5;
        p.vy = Math.random() * 4 + 2;
        p.vz = (Math.random() - 0.5) * 5;
        p.life = 0.35 + Math.random() * 0.2;
        p.maxLife = p.life;
        spawned++;
      }
    }
  }

  // Item Drop Pool
  const MAX_DROPS = 32;
  const dropGeo = new THREE.BoxGeometry(0.22, 0.22, 0.22);
  const dropPool = [];
  for (let i = 0; i < MAX_DROPS; i++) {
    const dMat = new THREE.MeshStandardMaterial({ map: texDirt, roughness: 0.8 });
    const dMesh = new THREE.Mesh(dropGeo, dMat);
    dMesh.visible = false;
    scene.add(dMesh);

  // Bow + arrows
  let bowCooldown = 0;
  const arrowPool = [];
  for (let i = 0; i < 24; i++) {
    const m = new THREE.Mesh(
      new THREE.BoxGeometry(0.08, 0.08, 0.55),
      new THREE.MeshBasicMaterial({ color: 0xc4a06a })
    );

  function shootBow() {
    if (bowCooldown > 0) return false;
    const held = typeof getSelectedItem === 'function' ? getSelectedItem() : null;
    if (!held || held.id !== 'Bow') return false;
    // Need an arrow in inv/hotbar (creative free)
    let arrowSlot = null;
    const findArrow = (arr) => {
      if (!arr) return null;
      for (let i = 0; i < arr.length; i++) {
        if (arr[i] && arr[i].id === 'Arrow' && arr[i].count > 0) return { arr, i };
      }
      return null;
    };
    if (gameMode !== 'creative') {
      arrowSlot = findArrow(hotSlots) || findArrow(invSlots);
      if (!arrowSlot) {
        addChatLine('System', 'No arrows!');
        return false;
      }
      arrowSlot.arr[arrowSlot.i].count -= 1;
      if (arrowSlot.arr[arrowSlot.i].count <= 0) arrowSlot.arr[arrowSlot.i] = null;
      if (typeof renderAllSlots === 'function') renderAllSlots();
    }
    const dir = new THREE.Vector3();
    camera.getWorldDirection(dir);

    if (!a) return false;
    a.active = true;
    a.life = 4.5;
    const origin = camera.position.clone().add(dir.clone().multiplyScalar(0.6));
    a.mesh.position.copy(origin);
    a.mesh.visible = true;
    const speed = 42;
    a.vx = dir.x * speed; a.vy = dir.y * speed; a.vz = dir.z * speed;

  function updateArrows(dt) {

      if (!a.active) continue;
      a.life -= dt;
      a.vy -= 18 * dt; // gravity
      a.mesh.position.x += a.vx * dt;
      a.mesh.position.y += a.vy * dt;
      a.mesh.position.z += a.vz * dt;
      a.mesh.lookAt(a.mesh.position.x + a.vx, a.mesh.position.y + a.vy, a.mesh.position.z + a.vz);
      // hit solid block
      const bx = Math.floor(a.mesh.position.x), by = Math.floor(a.mesh.position.y), bz = Math.floor(a.mesh.position.z);
      const bt = getBlock(bx, by, bz);
      if (bt > 0 && bt !== 7) {
        a.active = false; a.mesh.visible = false;
        continue;
      }
      // hit mobs
      for (const mob of mobList) {
        if (mob.hp <= 0) continue;
        if (a.mesh.position.distanceTo(mob.pos) < 1.2) {
          mob.hp -= 6;
          mob.flashRedTimer = 0.3;
          spawnParticles(mob.pos.x, mob.pos.y + 0.5, mob.pos.z, 0xff3333, 8);
          a.active = false; a.mesh.visible = false;

          break;
        }

      // hit TEST / duel bot
      if (a.active && testBot && testBot.hp > 0) {
        const d = a.mesh.position.distanceTo(new THREE.Vector3(testBot.x, testBot.y + 0.9, testBot.z));
        if (d < 1.1) {
          testBot.hp = Math.max(0, testBot.hp - 8);
          testBot.flash = 0.3;

  // Exact voxel raycast (Amanatides & Woo DDA). Fixed-step rays often hit a
  // neighboring block when the crosshair is near an edge; this hits the true block.
  function raycastVoxel(origin, dir, maxDist) {
    const ox = origin.x, oy = origin.y, oz = origin.z;
    let dx = dir.x, dy = dir.y, dz = dir.z;
    const len = Math.hypot(dx, dy, dz);
    if (len < 1e-8) return null;
    dx /= len; dy /= len; dz /= len;

    let x = Math.floor(ox);
    let y = Math.floor(oy);
    let z = Math.floor(oz);

    const stepX = dx > 0 ? 1 : (dx < 0 ? -1 : 0);
    const stepY = dy > 0 ? 1 : (dy < 0 ? -1 : 0);
    const stepZ = dz > 0 ? 1 : (dz < 0 ? -1 : 0);

    const tDeltaX = stepX !== 0 ? Math.abs(1 / dx) : Infinity;
    const tDeltaY = stepY !== 0 ? Math.abs(1 / dy) : Infinity;
    const tDeltaZ = stepZ !== 0 ? Math.abs(1 / dz) : Infinity;

    let tMaxX = stepX > 0 ? (Math.floor(ox) + 1 - ox) * tDeltaX
              : stepX < 0 ? (ox - Math.floor(ox)) * tDeltaX : Infinity;
    let tMaxY = stepY > 0 ? (Math.floor(oy) + 1 - oy) * tDeltaY
              : stepY < 0 ? (oy - Math.floor(oy)) * tDeltaY : Infinity;
    let tMaxZ = stepZ > 0 ? (Math.floor(oz) + 1 - oz) * tDeltaZ
              : stepZ < 0 ? (oz - Math.floor(oz)) * tDeltaZ : Infinity;

    // If we start inside a solid block, step out first so we hit the face ahead
    let prev = null;
    let t = 0;
    const maxSteps = Math.ceil(maxDist * 3) + 8;
    for (let i = 0; i < maxSteps && t <= maxDist; i++) {
      const type = getBlock(x, y, z);
      if (type > 0) {
        // Ignore water for targeting solid blocks; still return if only water
        if (type !== 7) {
          return {
            target: { x, y, z },
            type,
            previous: prev,
            distance: t
          };
        }
      }
      prev = { x, y, z };
      if (tMaxX < tMaxY) {
        if (tMaxX < tMaxZ) {
          x += stepX; t = tMaxX; tMaxX += tDeltaX;
        } else {
          z += stepZ; t = tMaxZ; tMaxZ += tDeltaZ;
        }
      } else {
        if (tMaxY < tMaxZ) {
          y += stepY; t = tMaxY; tMaxY += tDeltaY;
        } else {
          z += stepZ; t = tMaxZ; tMaxZ += tDeltaZ;
        }
      }
    }
    return null;
  }

          const held = (typeof getSelectedItem === 'function') ? getSelectedItem() : null;
          if (held) {
            if (/Sword$/.test(held.id)) dmg = /Diamond/.test(held.id) ? 14 : (/Iron/.test(held.id) ? 10 : (/Stone/.test(held.id) ? 8 : 6));
            else if (/Axe$/.test(held.id)) dmg = 7;
          }
          testBot.hp = Math.max(0, testBot.hp - dmg);
          testBot.flash = 0.35;
          playSound('hit');
          const kLen = Math.hypot(rayDir.x, rayDir.z) || 1;
          testBot.vx = (rayDir.x / kLen) * 7.5;
          testBot.vz = (rayDir.z / kLen) * 7.5;
          testBot.vy = Math.max(testBot.vy, 4.2);
          if (typeof resolveBotOutOfBlocks === 'function') resolveBotOutOfBlocks();
          spawnParticles(bc.x, bc.y, bc.z, 0xff3333, 12);
          addChatLine('PvP', 'Hit TEST for ' + dmg + ' dmg · HP ' + Math.ceil(testBot.hp) + '/' + testBot.maxHp);
          if (testBot.hp <= 0) {
            addChatLine('PvP', 'TEST was defeated! Respawning in 3s...');
            setTimeout(() => {
              if (!testBot) return;
              const sp = (typeof findSafeSpawn === 'function') ? findSafeSpawn(4, 4) : { x: 4, y: 50, z: 4 };
              testBot.hp = testBot.maxHp;
              testBot.x = sp.x; testBot.y = sp.y; testBot.z = sp.z;
              testBot.vx = 0; testBot.vy = 0; testBot.vz = 0;
              if (testBot.model) testBot.model.position.set(sp.x, sp.y, sp.z);
              addChatLine('PvP', 'TEST is back.');
            }, 3000);
          }
        }
      }

      // Duel bot
      if (!mobHit && duelBot && duelBot.hp > 0 && duelActive) {
        if (isCrosshairOnTarget(duelBot.x, duelBot.y + 0.9, duelBot.z, 3.5, 0.11) ||
            isCrosshairOnTarget(duelBot.x, duelBot.y + 1.5, duelBot.z, 3.5, 0.11)) {
          mobHit = true;
          let dmg = 4; // same as bot — fists only in duels
          if (!duelActive) {
            const held = typeof getSelectedItem === 'function' ? getSelectedItem() : null;
            if (held && /Sword$/.test(held.id)) dmg = 8;
          }
          duelBot.hp = Math.max(0, duelBot.hp - dmg);
          duelBot.flash = 0.3;
          const kLen = Math.hypot(rayDir.x, rayDir.z) || 1;
          duelBot.vx = (rayDir.x / kLen) * 6;
          duelBot.vz = (rayDir.z / kLen) * 6;
          duelBot.vy = 3.5;
          playSound('hit');
          spawnParticles(duelBot.x, duelBot.y + 0.9, duelBot.z, 0xff3333, 10);
          addChatLine('Duels', 'Hit BOT for ' + dmg + ' · HP ' + Math.ceil(duelBot.hp) + '/' + duelBot.maxHp);
        }
      }
      // Real remote players — crosshair only
      if (!mobHit) {
        for (const [rid, rp] of remotePlayers) {
          if (!rp || !rp.data || rp.isBot || rid === multiplayerId) continue;
          const px = rp.data.x || 0, py = rp.data.y || 0, pz = rp.data.z || 0;
          if (isCrosshairOnTarget(px, py + 0.9, pz, 3.8, 0.10) ||
              isCrosshairOnTarget(px, py + 1.5, pz, 3.8, 0.10)) {
            mobHit = true;
            let dmg = 4;
            const held = (typeof getSelectedItem === 'function') ? getSelectedItem() : null;
            if (held && /Sword$/.test(held.id)) dmg = /Diamond/.test(held.id) ? 14 : (/Iron/.test(held.id) ? 10 : 6);
            playSound('hit');
            spawnParticles(px, py + 0.9, pz, 0xff3333, 10);
            if (multiplayerSocket && multiplayerSocket.readyState === WebSocket.OPEN) {
              multiplayerSocket.send(JSON.stringify({
                type: 'hit',
                target: rid,
                targetName: rp.data.name,
                dmg,
                kbX: rayDir.x * 8,
                kbY: 4.5,
                kbZ: rayDir.z * 8
              }));
            }
            addChatLine('PvP', 'Hit ' + (rp.data.name || 'Player') + ' for ' + dmg);
            break;
          }
        }
      }
    }

    // If no mob hit, only flag holding — progress starts in updateBlockBreaking.
    // IMPORTANT: do NOT pre-set breakState.key here (that caused instant breaks).
    if (mobHit) {
      isBreaking = false;
      resetBreakState();
    }
  }

  const FOOD_HEAL = {
    Beef: 40, Pork: 40, Mutton: 30, Chicken: 30, Bread: 30, Apple: 20
  };
  function tryEatFood() {
    const stack = getSelectedItem();
    if (!stack || !FOOD_HEAL[stack.id]) return false;
    if (playerHealth >= 100) return false; // already full
    const heal = FOOD_HEAL[stack.id];
    playerHealth = Math.min(100, playerHealth + heal);
    stack.count--;
    if (stack.count <= 0) hotSlots[selectedHotbar] = null;
    if (state.inventory && state.inventory[stack.id] > 0) state.inventory[stack.id]--;
    renderAllSlots();
    playSound('pickup');
    if (typeof addChatLine === 'function') {
      const hearts = Math.round(heal / 10);
      addChatLine('System', 'Ate ' + stack.id + ' (+' + hearts + ' hearts)');
    }
    return true;
  }

  function triggerPlace() {
    // Right-click Ender Pearl = throw pearl (same as Q)
    const heldPearl = getSelectedItem();
    if (heldPearl && heldPearl.id === 'Ender Pearl' && !isGliding) {
      const now = performance.now();
      if (window.__pearlCooldownUntil && now < window.__pearlCooldownUntil) {
        addChatLine('System', 'Ender Pearl cooldown...');
        return;
      }
      window.__pearlCooldownUntil = now + 3000;
      const throwDir = new THREE.Vector3();
      camera.getWorldDirection(throwDir);
      if (typeof spawnEnderPearlProjectile === 'function') {
        spawnEnderPearlProjectile(playerPos.x + throwDir.x * 0.8, playerPos.y + 1.4, playerPos.z + throwDir.z * 0.8, throwDir.x, throwDir.y, throwDir.z);
      }
      if (gameMode !== 'creative') {
        heldPearl.count--;
        if (heldPearl.count <= 0) hotSlots[selectedHotbar] = null;
        renderAllSlots();
      }
      isSwinging = true; swingProgress = 0;
      playSound('jump');
      return;
    }
    // Firework rocket boost while gliding
    const heldFw = getSelectedItem();
    const fwFromOff = offhandSlot && offhandSlot.id === 'Firework Rocket';
    const fwFromMain = heldFw && heldFw.id === 'Firework Rocket';
    if (isGliding && (fwFromOff || fwFromMain)) {
      elytraBoostT = 1.15; // short burst — spam rockets to keep flying
      if (gameMode !== 'creative') {
        if (fwFromOff) {
          offhandSlot.count--;
          if (offhandSlot.count <= 0) offhandSlot = null;
        } else if (fwFromMain) {
          heldFw.count--;
          if (heldFw.count <= 0) {
            const idx = selectedHotbar;
            if (hotSlots[idx] && hotSlots[idx].id === 'Firework Rocket') hotSlots[idx] = null;
          }
        }
        renderAllSlots();
      }
      playSound('jump');
      return;
    }
    // Right-click food in hand = eat (Minecraft style)
    const held = getSelectedItem();
    if (held && FOOD_HEAL[held.id]) {
      // Prefer opening crafting table / placing blocks if looking at them
      // else eat
      const rayDir0 = new THREE.Vector3();
      camera.getWorldDirection(rayDir0);
      const origin0 = camera.position.clone().addScaledVector(rayDir0, 0.05);
      const aimHit = raycastVoxel(origin0, rayDir0, 4.5);
      const aimingBlock = !!(aimHit && aimHit.type > 0 && aimHit.type !== 7);
      if (!aimingBlock) {
        tryEatFood();
        return;
      }
      // if aiming at block but holding food (not placeable), still eat
      if (!(['Grass','Dirt','Stone','Wood','Leaves','Sand','Cactus','Crafting Table'].includes(held.id))) {
        tryEatFood();
        return;
      }
    }

    const rayDir = new THREE.Vector3();
    camera.getWorldDirection(rayDir);
    const origin = camera.position.clone().addScaledVector(rayDir, 0.05);
    const hit = raycastVoxel(origin, rayDir, 4.5);
    if (hit && hit.type > 0) {
      {
        const type = hit.type;
        const prev = hit.previous;
        // Right-click crafting table to open 3x3
        if (type === 10) {
          openCraftTable();
          return;
        }
        if (type === 15) {
          openChestAt(hit.target.x, hit.target.y, hit.target.z);
          return;
        }
        if (type === 17) {
          // simple furnace: smelt iron/gold ore if holding ore + coal in inv later
          openFurnaceAt(hit.target.x, hit.target.y, hit.target.z);
          return;
        }
        // Water / Lava bucket place
        const heldB = getSelectedItem();
        if (heldB && (heldB.id === 'Water Bucket' || heldB.id === 'Lava Bucket') && prev) {
          const fluid = heldB.id === 'Water Bucket' ? 7 : 16;
          setBlock(prev.x, prev.y, prev.z, fluid);
          sendNetworkBlock(prev.x, prev.y, prev.z, fluid);
          if (gameMode !== 'creative') {
            heldB.id = 'Bucket';
            // keep count
          }
          renderAllSlots();
          updateInstancedWorld();
          return;
        }
        // Empty bucket pickup water/lava
        if (heldB && heldB.id === 'Bucket' && (type === 7 || type === 16)) {
          if (gameMode !== 'creative') {
            heldB.id = type === 7 ? 'Water Bucket' : 'Lava Bucket';
          }
          setBlock(hit.target.x, hit.target.y, hit.target.z, 0);
          sendNetworkBlock(hit.target.x, hit.target.y, hit.target.z, 0);
          renderAllSlots();
          updateInstancedWorld();
          return;
        }
        if (prev) {
          // Avoid placing inside player body
          const pMin = playerPos.clone().sub(new THREE.Vector3(0.3, 0, 0.3));
          const pMax = playerPos.clone().add(new THREE.Vector3(0.3, 1.8, 0.3));
          if (!(prev.x >= pMin.x - 0.9 && prev.x <= pMax.x &&
                prev.y >= pMin.y - 0.9 && prev.y <= pMax.y &&
                prev.z >= pMin.z - 0.9 && prev.z <= pMax.z)) {
            const placeMap = { Grass: 1, Dirt: 2, Stone: 3, Wood: 4, Leaves: 5, Sand: 6, Cactus: 8, 'Crafting Table': 10, 'Coal Ore': 11, 'Iron Ore': 12, 'Gold Ore': 13, 'Diamond Ore': 14, Chest: 15, Furnace: 17 };
            const stack = getSelectedItem();
            if (!stack) { /* no place */ }
            else {
            const selectedName = stack.id;
            const blockId = placeMap[selectedName];
            if (blockId && blockId !== 7 && blockId !== 9) {
              setBlock(prev.x, prev.y, prev.z, blockId);
              sendNetworkBlock(prev.x, prev.y, prev.z, blockId);
              if (gameMode !== 'creative') {
                stack.count--;
                if (stack.count <= 0) hotSlots[selectedHotbar] = null;
                if (state.inventory && state.inventory[selectedName] > 0) state.inventory[selectedName]--;
              }
              renderAllSlots();
              window.__worldMeshDirty = true;
              playSound('break');
              saveGame();
            }
            }
          }
        }
      }
    }
  }

  // AABB Physics for Player (+ Minecraft-style swimming)
  let playerInWater = false;
  
  function hasGroundUnder(px, py, pz) {
    // sample feet corners — solid block just below feet?
    const y = Math.floor(py - 0.08);
    const offs = [[-0.25, -0.25], [-0.25, 0.25], [0.25, -0.25], [0.25, 0.25], [0, 0]];
    for (const [ox, oz] of offs) {
      if (isSolidBlock(getBlock(px + ox, y, pz + oz))) return true;
    }
    return false;
  }

  function updatePlayerPhysics(dt) {
    // Inventory/pause no longer freeze movement (multiplayer stays live)
    const menuLock = chatOpen; // only soft-slow while typing chat
    const fwdX = -Math.sin(yaw);
    const fwdZ = -Math.cos(yaw);
    const rightX = Math.cos(yaw);
    const rightZ = -Math.sin(yaw);

    // Sample water at feet and torso
    const waterFeet = getBlock(playerPos.x, playerPos.y + 0.2, playerPos.z) === 7;
    const waterTorso = getBlock(playerPos.x, playerPos.y + 1.0, playerPos.z) === 7;
    const waterHead = getBlock(playerPos.x, playerPos.y + 1.55, playerPos.z) === 7;
    playerInWater = waterFeet || waterTorso;

    let moveX = 0;
    let moveZ = 0;
    if (!menuLock && !inventoryVisible && !paused && !craftTableOpen) {
      if (keys.w) { moveX += fwdX; moveZ += fwdZ; }
      if (keys.s) { moveX -= fwdX; moveZ -= fwdZ; }
      if (keys.a) { moveX -= rightX; moveZ -= rightZ; }
      if (keys.d) { moveX += rightX; moveZ += rightZ; }
    }

    const len = Math.hypot(moveX, moveZ);
    if (playerInWater) {
      // Swim: slower horizontal, Space rises, Shift sinks
      const swimSpd = keys.shift ? 2.2 : 3.4;
      if (len > 0) {
        playerVel.x = (moveX / len) * swimSpd;
        playerVel.z = (moveZ / len) * swimSpd;
      } else {
        playerVel.x *= 0.85;
        playerVel.z *= 0.85;
      }
      if (keys.space) {
        playerVel.y = Math.min(4.2, playerVel.y + 14 * dt);
      } else if (keys.shift) {
        playerVel.y = Math.max(-3.5, playerVel.y - 10 * dt);
      } else {
        // gentle buoyancy toward surface
        playerVel.y += (waterHead ? -2.5 : 3.5) * dt;
        playerVel.y *= 0.92;
      }
    } else if (isFlying) {
      // Creative/command fly
      const base = Math.max(8, Math.min(1e9, flyBoostSpeed || 10));
      const flySpd = keys.shift ? base : Math.max(8, base * 0.45);
      if (len > 0) {
        playerVel.x = (moveX / len) * flySpd;
        playerVel.z = (moveZ / len) * flySpd;
      } else {
        playerVel.x *= 0.75;
        playerVel.z *= 0.75;
      }
      if (keys.space) playerVel.y = flySpd * 0.85;
      else if (keys.c) playerVel.y = -flySpd * 0.85;
      else playerVel.y *= 0.7;
      isGliding = false;
    } else if (isGliding) {
      // Minecraft-like elytra speeds:
      // fireworks ~35.5 blocks/s, dive peak ~80 blocks/s
      const lookY = Math.sin(pitch);
      const lookX = -Math.sin(yaw) * Math.cos(pitch);
      const lookZ = -Math.cos(yaw) * Math.cos(pitch);
      let spd = Math.hypot(playerVel.x, playerVel.y, playerVel.z);
      if (elytraBoostT > 0) {
        // rocket boost toward look, target ~35.5
        const target = 35.5;
        const kick = 55 * dt;
        playerVel.x += lookX * kick;
        playerVel.y += lookY * kick;
        playerVel.z += lookZ * kick;
        elytraBoostT -= dt;
        spd = Math.hypot(playerVel.x, playerVel.y, playerVel.z);
        if (spd > target) {
          const s = target / spd;
          playerVel.x *= s; playerVel.y *= s; playerVel.z *= s;
        }
      }
      // Dive bonus when looking down (up to ~80)
      const diveFactor = lookY < -0.3 ? (-lookY - 0.3) * 1.4 : 0;
      const maxSpd = 35.5 + diveFactor * 45; // up to ~80 in steep dive
      // Soft align to look
      const align = 2.2 * dt;
      const desired = Math.max(spd, 8);
      playerVel.x += (lookX * desired - playerVel.x) * align;
      playerVel.y += (lookY * desired - playerVel.y) * align * 0.9;
      playerVel.z += (lookZ * desired - playerVel.z) * align;
      playerVel.y -= 4.5 * dt; // mild gravity
      // Drag without rockets
      const drag = elytraBoostT > 0 ? 0.05 : 0.85;
      playerVel.x *= Math.max(0, 1 - drag * dt);
      playerVel.y *= Math.max(0, 1 - drag * dt * 0.4);
      playerVel.z *= Math.max(0, 1 - drag * dt);
      spd = Math.hypot(playerVel.x, playerVel.y, playerVel.z);
      // Cap absolute max
      if (spd > maxSpd) {
        const s = maxSpd / spd;
        playerVel.x *= s; playerVel.y *= s; playerVel.z *= s;
        spd = maxSpd;
      }
      if (spd < 5 && elytraBoostT <= 0) isGliding = false;
      if (playerOnGround || playerInWater) isGliding = false;
      if (typeof steve !== 'undefined' && steve) steve.rotation.x = -Math.PI / 2;
    } else {
      if (typeof steve !== 'undefined' && steve && !isGliding) {
        steve.rotation.x = 0;
      }
      isCrouching = !!keys.c;
      let speed = keys.shift ? 7.5 : 4.8;
      if (isCrouching) speed = 2.2;
      if (len > 0) {
        playerVel.x = (moveX / len) * speed;
        playerVel.z = (moveZ / len) * speed;
      } else {
        playerVel.x *= 0.7;
        playerVel.z *= 0.7;
      }
      if (keys.space && playerOnGround && !isCrouching) {
        playerVel.y = 7.2;
        playerOnGround = false;
        playSound('jump');
      }
      // Deploy elytra: double-jump style — press Space again in mid-air while wearing elytra
      const hasElytra = !!(armorSlots && armorSlots[1] && armorSlots[1].id === 'Elytra');
      const spacePressed = !!keys.space;
      if (!window.__spaceWasDown) window.__spaceWasDown = false;
      const spaceEdge = spacePressed && !window.__spaceWasDown;
      window.__spaceWasDown = spacePressed;
      if (!isFlying && !isGliding && !playerOnGround && !playerInWater && hasElytra && spaceEdge) {
        // second jump in air → open elytra
        isGliding = true;
        // convert fall into forward glide speed
        const lookX = -Math.sin(yaw) * Math.cos(pitch);
        const lookZ = -Math.cos(yaw) * Math.cos(pitch);
        const launch = Math.max(10, Math.hypot(playerVel.x, playerVel.z) + 6);
        playerVel.x = lookX * launch;
        playerVel.z = lookZ * launch;
        playerVel.y = Math.max(playerVel.y, 1.5);
        playSound('jump');
      }
      // Fall damage tracking
      if (!playerOnGround && playerVel.y < -0.5) {
        window.__fallVy = Math.min(window.__fallVy || 0, playerVel.y);
      }
      playerVel.y -= 22.0 * dt; // Gravity
    }

    // AABB Resolution X with auto-step + sneak edge (Minecraft)
    const wasGrounded = playerOnGround;
    const prevX = playerPos.x;
    playerPos.x += playerVel.x * dt;
    if (checkCollision(playerPos)) {
      if (playerOnGround && !playerInWater && !isCrouching && Math.abs(playerVel.x) > 0.1) {
        playerPos.y += 1.05;
        if (checkCollision(playerPos)) {
          playerPos.y -= 1.05;
          playerPos.x -= playerVel.x * dt;
          playerVel.x = 0;
        }
      } else {
        playerPos.x -= playerVel.x * dt;
        playerVel.x = 0;
      }
    } else if (isCrouching && wasGrounded && !isFlying && !playerInWater && Math.abs(playerVel.x) > 0.01) {
      // Sneak: don't walk off edges
      if (!hasGroundUnder(playerPos.x, playerPos.y, playerPos.z)) {
        playerPos.x = prevX;
        playerVel.x = 0;
      }
    }

    // AABB Resolution Y
    playerPos.y += playerVel.y * dt;
    playerOnGround = false;
    if (checkCollision(playerPos)) {
      if (playerVel.y < 0) {
        playerOnGround = true;
        // Fall damage (survival only)
        if (gameMode !== 'creative' && !isFlying && !playerInWater && !isGliding) {
          const fv = window.__fallVy || 0;
          // Estimate fall distance from impact speed: d ≈ v^2 / (2g), g~22
          const fallDist = (fv * fv) / (2 * 22);
          // Safe fall ~3 blocks; then 0.5 heart (5 HP) per 2 blocks
          if (fallDist > 3) {
            const excess = fallDist - 3;
            let dmg = Math.floor((excess / 2) * 5); // 0.5 heart per 2 blocks
            dmg = Math.max(0, Math.floor(dmg * (1 - armorProtection())));
            if (dmg > 0) {
              playerHealth = Math.max(0, playerHealth - dmg);
              playSound('hit');
              if (playerHealth <= 0) triggerDeath();
            }
          }
        }
        window.__fallVy = 0;
      }
      playerPos.y -= playerVel.y * dt;
      playerVel.y = 0;
    }

    // AABB Resolution Z with auto-step + sneak edge
    const prevZ = playerPos.z;
    playerPos.z += playerVel.z * dt;
    if (checkCollision(playerPos)) {
      if (playerOnGround && !playerInWater && !isCrouching && Math.abs(playerVel.z) > 0.1) {
        playerPos.y += 1.05;
        if (checkCollision(playerPos)) {
          playerPos.y -= 1.05;
          playerPos.z -= playerVel.z * dt;
          playerVel.z = 0;
        }
      } else {
        playerPos.z -= playerVel.z * dt;
        playerVel.z = 0;
      }
    } else if (isCrouching && wasGrounded && !isFlying && !playerInWater && Math.abs(playerVel.z) > 0.01) {
      if (!hasGroundUnder(playerPos.x, playerPos.y, playerPos.z)) {
        playerPos.z = prevZ;
        playerVel.z = 0;
      }
    }

    // Keep player in bounds (bedrock walls stop you at world edge ~300 depth)
    playerPos.x = WH.clamp(playerPos.x, -WORLD_LIMIT + 2, WORLD_LIMIT - 2);
    playerPos.z = WH.clamp(playerPos.z, -WORLD_LIMIT + 2, WORLD_LIMIT - 2);
    playerPos.y = WH.clamp(playerPos.y, 0.5, WORLD_H - 2);
    if (playerPos.y < 0.5) {
      playerPos.y = 40;
      playerVel.set(0, 0, 0);
    }
  }

  function checkCollision(pos) {
    const minX = Math.floor(pos.x - 0.28);
    const maxX = Math.floor(pos.x + 0.28);
    const minY = Math.floor(pos.y);
    const maxY = Math.floor(pos.y + 1.75);
    const minZ = Math.floor(pos.z - 0.28);
    const maxZ = Math.floor(pos.z + 0.28);

    for (let x = minX; x <= maxX; x++) {
      for (let y = minY; y <= maxY; y++) {
        for (let z = minZ; z <= maxZ; z++) {
          if (isSolidBlock(getBlock(x, y, z))) return true;
        }
      }
    }
    return false;
  }

  // Reset Game Helper
  function resetAll() {
    playerPos.set(0, 10, 0);
    playerVel.set(0, 0, 0);
    yaw = 0; pitch = 0;
    kills = 0;
    playerHealth = 100;
    buildTerrain();
    initMobs();
  }

  // Subscribe to Reset trigger
  state._subscribe('triggerReset', () => {
    resetAll();
  });

  // Sampling HUD variables for Editorial decoupled update
  let frameCounter = 0;
  let lastSampleTime = performance.now();

  // Decoupled Editorial update callback
  const updateEditorial = () => {
    const fpsVal = state.fps ?? 60;
    const hp = state.playerHealthPct ?? 100;
    const heartsCount = Math.max(1, Math.ceil(hp / 10));
    const heartsStr = '❤️'.repeat(heartsCount);
    const mobsAlive = state.mobsAlive ?? 6;
    const killVal = state.kills ?? 0;

    ui.setEditorial({
      hud: [
        { label: "FPS", value: `${fpsVal}` },
        { label: "Health", value: `${heartsStr} (${hp}%)` },
        { label: "Mobs", value: `${mobsAlive} alive` },
        { label: "Kills", value: `${killVal}` }
      ]
    });
  };

  state._subscribe('fps', updateEditorial);
  state._subscribe('playerHealthPct', updateEditorial);
  state._subscribe('mobsAlive', updateEditorial);
  state._subscribe('kills', updateEditorial);
  updateEditorial();

  // Render Loop
  return ({ dt }) => {
    if (!state.play) return;
    // Still render scene in lobby (camera idle); freeze simulation until Multiplayer
    if (!window.__gameStarted) {
      camera.position.set(0, 12, 18);
      camera.lookAt(0, 6, 0);
      return;
    }
    if (isDead) {
      deathCountdown -= dt;
      if (deathCountdown > 0) {
        deathCountdownEl.textContent = 'Respawn available in ' + Math.ceil(deathCountdown) + '...';
        deathRespawnBtn.disabled = true;
      } else {
        deathCountdownEl.textContent = 'Click Respawn to continue';
        deathRespawnBtn.disabled = false;
      }
      return;
    }
    // pending /home teleport
    if (pendingTeleport) {
      pendingTeleport.t -= dt;
      if (pendingTeleport.t <= 0) {
        playerPos.set(pendingTeleport.x, pendingTeleport.y, pendingTeleport.z);
        playerVel.set(0, 0, 0);
        addChatLine('System', 'Teleported home!');
        pendingTeleport = null;
      }
    }
    const safeDt = Math.min(dt, 0.05);

    // Update Player & Camera
    updatePlayerPhysics(safeDt);
    {
      const ncx = worldToChunk(playerPos.x);
      const ncz = worldToChunk(playerPos.z);
      if (ncx !== lastChunkCX || ncz !== lastChunkCZ) {
        lastChunkCX = ncx;
        lastChunkCZ = ncz;
        // Only generate missing chunks here (cheap). Mesh rebuild is throttled below.
        ensureChunksAround(playerPos.x, playerPos.z);
        window.__worldMeshDirty = true;
      }
    }
    // Camera modes (P key cycles like Minecraft F5)
    const eyeH = (isCrouching && !isFlying) ? 1.25 : 1.62;
    if (isSpectating) {
      const spd = keys.shift ? 28 : 12;
      const fx = -Math.sin(yaw) * Math.cos(pitch);
      const fy = Math.sin(pitch);
      const fz = -Math.cos(yaw) * Math.cos(pitch);
      const rx = Math.cos(yaw), rz = -Math.sin(yaw);
      if (keys.w) { spectatePos.x += fx * spd * safeDt; spectatePos.y += fy * spd * safeDt; spectatePos.z += fz * spd * safeDt; }
      if (keys.s) { spectatePos.x -= fx * spd * safeDt; spectatePos.y -= fy * spd * safeDt; spectatePos.z -= fz * spd * safeDt; }
      if (keys.a) { spectatePos.x -= rx * spd * safeDt; spectatePos.z -= rz * spd * safeDt; }
      if (keys.d) { spectatePos.x += rx * spd * safeDt; spectatePos.z += rz * spd * safeDt; }
      if (keys.space) spectatePos.y += spd * safeDt;
      if (keys.c) spectatePos.y -= spd * safeDt;
      camera.position.copy(spectatePos);
      camera.rotation.set(pitch, yaw, 0, 'YXZ');
      if (typeof steve !== 'undefined' && steve) steve.visible = false;
      if (handGroup) handGroup.visible = false;
      const under = typeof isSolidBlock === 'function' && isSolidBlock(getBlock(spectatePos.x, spectatePos.y, spectatePos.z));
      if (typeof instMeshes !== 'undefined') {
        instMeshes.forEach(m => {
          const mats = Array.isArray(m.material) ? m.material : [m.material];
          mats.forEach(mat => { if (mat) mat.depthTest = !under; });
        });
      }
      if (scene && scene.fog) {
        if (!_savedFogDensity) _savedFogDensity = scene.fog.density;
        scene.fog.density = under ? 0.002 : (_savedFogDensity || 0.028);
      }
    } else if (camMode === 0) {
      // 1st person
      camera.position.set(playerPos.x, playerPos.y + eyeH, playerPos.z);
      camera.rotation.set(pitch, yaw, 0, 'YXZ');
      steve.visible = false;
      if (handGroup) {
        handGroup.visible = (settings.showHand !== false);
        // keep arm + empty hand visible
        if (window.__fpHand) {
          const sel = (typeof getSelectedItem === 'function') ? getSelectedItem() : null;
          window.__fpHand.visible = !sel && (settings.showHand !== false);
        }
        if (heldBlockMesh) {
          const sel = (typeof getSelectedItem === 'function') ? getSelectedItem() : null;
          heldBlockMesh.visible = !!sel && (settings.showHand !== false);
        }
      }
    } else {
      // 3rd person: free look camera (mouse moves view, not locked body-only)
      if (handGroup) handGroup.visible = false;
      steve.visible = true;
      steve.position.set(playerPos.x, playerPos.y, playerPos.z);
      // Body faces movement if walking, else faces look yaw (Minecraft-like)
      const moving = Math.hypot(playerVel.x, playerVel.z) > 0.4;
      if (moving) {
        steve.rotation.y = Math.atan2(-playerVel.x, -playerVel.z);
      } else {
        steve.rotation.y = yaw;
      }
      if (moving || playerInWater) {
        steveWalk += safeDt * (playerInWater ? 8 : 10);
        const a = Math.sin(steveWalk) * 0.7;
        steveArmL.rotation.x = a;
        steveArmR.rotation.x = -a;
        steveLegL.rotation.x = -a;
        steveLegR.rotation.x = a;
      } else {
        steveArmL.rotation.x *= 0.8;
        steveArmR.rotation.x *= 0.8;
        steveLegL.rotation.x *= 0.8;
        steveLegR.rotation.x *= 0.8;
      }
      // Orbit camera around player based on mouse look (free camera)
      const back = camMode === 1;
      const dist = 4.2;
      const lookPitch = Math.max(-1.2, Math.min(1.2, pitch));
      const offY = Math.sin(lookPitch) * dist;
      const offXZ = Math.cos(lookPitch) * dist;
      const cx = playerPos.x + (back ? Math.sin(yaw) : -Math.sin(yaw)) * offXZ;
      const cz = playerPos.z + (back ? Math.cos(yaw) : -Math.cos(yaw)) * offXZ;
      const cy = playerPos.y + eyeH + 0.35 - offY * 0.85;
      camera.position.set(cx, cy, cz);
      camera.lookAt(playerPos.x, playerPos.y + eyeH * 0.75, playerPos.z);
    }
    multiplayerTick();
    if (typeof updateTestBotVisual === 'function') updateTestBotVisual(safeDt);
    if (typeof updateArrows === 'function') updateArrows(safeDt);
    if (typeof updateDuelBot === 'function') updateDuelBot(safeDt);
    updateBlockBreaking(safeDt);

    // Soft world border near ±WORLD_LIMIT
    {
      const margin = WORLD_LIMIT - 8;
      let pushed = false;
      if (playerPos.x > margin) { playerPos.x = margin; playerVel.x = -2; pushed = true; }
      if (playerPos.x < -margin) { playerPos.x = -margin; playerVel.x = 2; pushed = true; }
      if (playerPos.z > margin) { playerPos.z = margin; playerVel.z = -2; pushed = true; }
      if (playerPos.z < -margin) { playerPos.z = -margin; playerVel.z = 2; pushed = true; }
      if (pushed && Math.random() < 0.02) addChatLine('System', 'You reached the world border.');
    }

    // Cactus contact damage (desert itself is safe)
    {
      let touchingCactus = false;
      for (let ox = -1; ox <= 1 && !touchingCactus; ox++) {
        for (let oy = 0; oy <= 2 && !touchingCactus; oy++) {
          for (let oz = -1; oz <= 1 && !touchingCactus; oz++) {
            if (getBlock(playerPos.x + ox * 0.35, playerPos.y + oy * 0.55, playerPos.z + oz * 0.35) === 8) {
              touchingCactus = true;
            }
          }
        }
      }
      if (touchingCactus && !inventoryVisible && gameMode !== 'creative' && !isFlying) {
        desertDamageTimer -= safeDt;
        if (desertDamageTimer <= 0) {
          const prot = (typeof armorProtection === 'function') ? armorProtection() : 0;
          playerHealth = Math.max(0, playerHealth - Math.max(1, 8 * (1 - prot)));
          playSound('hit');
          desertDamageTimer = 0.55;
          if (playerHealth <= 0) triggerDeath();
        }
      } else {
        desertDamageTimer = Math.min(desertDamageTimer, 0.15);
      }
      // Lava damage
      let inLava = false;
      for (let oy = 0; oy <= 2 && !inLava; oy++) {
        if (getBlock(playerPos.x, playerPos.y + oy * 0.6, playerPos.z) === 16) inLava = true;
      }
      if (inLava && gameMode !== 'creative') {
        window.__lavaTimer = (window.__lavaTimer || 0) - safeDt;
        if (window.__lavaTimer <= 0) {
          const prot = (typeof armorProtection === 'function') ? armorProtection() : 0;
          playerHealth = Math.max(0, playerHealth - Math.max(2, 14 * (1 - prot)));
          playSound('hit');
          window.__lavaTimer = 0.4;
          if (playerHealth <= 0) triggerDeath();
        }
      }
    }

    // Swing Animation
    if (isSwinging) {
      swingProgress += safeDt * 6.0;
      if (swingProgress >= 1.0) {
        swingProgress = 0;
        isSwinging = false;
      }
    }
    const swingAngle = Math.sin(swingProgress * Math.PI);
    if (handGroup) {
      handGroup.position.z = -0.5 + swingAngle * 0.12;
      handGroup.position.y = -0.32 - swingAngle * 0.08;
      handGroup.rotation.x = -swingAngle * 1.1;
      handGroup.rotation.y = swingAngle * 0.4;
    }

    // Update Mobs
    let aliveMobsCount = 0;
    for (let mob of mobList) {
      if (mob.hp <= 0) {
        mob.group.visible = false;
        continue;
      }
      mob.group.visible = true;
      aliveMobsCount++;

      // Red Flash timer
      if (mob.flashRedTimer > 0) {
        mob.flashRedTimer -= safeDt;
        mob.mat.color.setHex(0xff3333);
      } else {
        mob.mat.color.setHex(0xffffff);
      }

      // Mob Physics & AI
      mob.vel.y -= 18.0 * safeDt;
      mob.walkPhase += safeDt * 4.0;

      // Random wander vector
      if (Math.random() < 0.015) mob.yaw += (Math.random() - 0.5) * 1.5;
      
      const moveSpd = 1.2;
      mob.vel.x += Math.sin(mob.yaw) * moveSpd * safeDt;
      mob.vel.z += Math.cos(mob.yaw) * moveSpd * safeDt;

      mob.pos.x += mob.vel.x * safeDt;
      if (isSolidBlock(getBlock(mob.pos.x, mob.pos.y, mob.pos.z))) mob.pos.x -= mob.vel.x * safeDt;

      mob.pos.y += mob.vel.y * safeDt;
      if (isSolidBlock(getBlock(mob.pos.x, mob.pos.y, mob.pos.z))) {
        if (mob.vel.y < 0) mob.onGround = true;
        mob.pos.y -= mob.vel.y * safeDt;
        mob.vel.y = 0;
      }

      mob.pos.z += mob.vel.z * safeDt;
      if (isSolidBlock(getBlock(mob.pos.x, mob.pos.y, mob.pos.z))) mob.pos.z -= mob.vel.z * safeDt;

      mob.vel.x *= 0.82;
      mob.vel.z *= 0.82;

      mob.group.position.copy(mob.pos);
      mob.group.rotation.y = mob.yaw;

      // Animate Legs
      const legAngle = Math.sin(mob.walkPhase) * 0.5;
      mob.legs.forEach((leg, i) => {
        leg.rotation.x = (i % 2 === 0) ? legAngle : -legAngle;
      });
    }

    // Show only the mob currently under the crosshair, inside the game view.
    const lookDir = new THREE.Vector3();
    camera.getWorldDirection(lookDir);
    let targetMob = null;
    let targetDistance = Infinity;
    for (const mob of mobList) {
      if (mob.hp <= 0) continue;
      const mobCenter = mob.pos.clone().add(new THREE.Vector3(0, 0.7, 0));
      const distance = camera.position.distanceTo(mobCenter);
      if (distance < 6 && distance < targetDistance && lookDir.dot(mobCenter.clone().sub(camera.position).normalize()) > 0.92) {
        targetMob = mob;
        targetDistance = distance;
      }
    }
    if (targetMob) {
      targetEl.classList.add('visible');
      targetNameEl.textContent = `${targetMob.type} · ${Math.max(0, targetMob.hp)} / ${targetMob.maxHp}`;
      targetBarEl.style.width = `${Math.max(0, targetMob.hp / targetMob.maxHp * 100)}%`;
    } else {
      targetEl.classList.remove('visible');
    }

    const hpPercent = Math.max(0, Math.min(100, playerHealth));
    const heartsFull = Math.floor(hpPercent / 10);
    const heartsHalf = (hpPercent % 10) >= 5 ? 1 : 0;
    if (heartsEl) {
      let html = '';
      for (let i = 0; i < 10; i++) {
        if (i < heartsFull) html += '<span class="voxel-heart">❤</span>';
        else if (i === heartsFull && heartsHalf) html += '<span class="voxel-heart half">❤</span>';
        else html += '<span class="voxel-heart empty">❤</span>';
      }
      heartsEl.innerHTML = html;
    }
    if (debugVisible) {
      debugEl.textContent = `XYZ  ${playerPos.x.toFixed(1)}  ${playerPos.y.toFixed(1)}  ${playerPos.z.toFixed(1)}\nFPS  ${state.fps ?? 60}\nChunks  ${chunks.size}  VD ${viewDistanceChunks}\nLimit  ±${WORLD_LIMIT}`;
    }

    // Update Particles
    for (let p of particlePool) {
      if (p.mesh.visible) {
        p.life -= safeDt;
        if (p.life <= 0) {
          p.mesh.visible = false;
        } else {
          p.vy -= 16 * safeDt;
          p.mesh.position.x += p.vx * safeDt;
          p.mesh.position.y += p.vy * safeDt;
          p.mesh.position.z += p.vz * safeDt;
          const scale = (p.life / p.maxLife) * 0.1;
          p.mesh.scale.set(scale, scale, scale);
        }
      }
    }

    if (typeof updateProjectiles === 'function') updateProjectiles(safeDt);
    // Update Item Drops
    for (let d of dropPool) {
      if (!d.mesh.visible) continue;
      d.baseRot += safeDt * 2.5;
      d.mesh.rotation.y = d.baseRot;
      // Gravity toward ground if floating
      const feetY = Math.floor(d.y - 0.05);
      if (!isSolidBlock(getBlock(d.x, feetY, d.z)) && d.y > 1) {
        d.y -= 4 * safeDt;
      }
      const bob = Math.sin(d.baseRot * 2) * 0.06;
      d.mesh.position.set(d.x, d.y + bob, d.z);

      // Thrown items ignore pickup for a short time
      if (d.noPickupUntil && performance.now() < d.noPickupUntil) {
        continue;
      }
      const dist = playerPos.distanceTo(new THREE.Vector3(d.x, d.y, d.z));
      if (dist < 2.2) {
        const pull = Math.min(1, safeDt * 8);
        d.x += (playerPos.x - d.x) * pull;
        d.y += (playerPos.y + 0.9 - d.y) * pull;
        d.z += (playerPos.z - d.z) * pull;
        d.mesh.position.set(d.x, d.y, d.z);
        if (dist < 1.0) {
          d.mesh.visible = false;
          playSound('pickup');
          const dropMap = {
            'Cow Item': 'Beef', 'Sheep Item': 'Mutton', 'Chicken Item': 'Chicken', 'Pig Item': 'Pork'
          };
          const invName = dropMap[d.type] || d.type;
          if (gameMode !== 'creative') {
            addToInventory(invName, 1);
            if (state.inventory) state.inventory[invName] = (state.inventory[invName] || 0) + 1;
          }
        }
      }
    }

    // Refresh world mesh as you move (stops x-ray when digging/traveling)
    if (!window.__lastMeshPos) window.__lastMeshPos = playerPos.clone();
    // Throttle expensive mesh rebuild while moving (fixes FPS drop on walk)
    {
      const movedFar = window.__lastMeshPos.distanceTo(playerPos) > 12;
      const nowM = performance.now();
      if (!window.__lastMeshRebuildAt) window.__lastMeshRebuildAt = 0;
      if ((window.__worldMeshDirty || movedFar) && (nowM - window.__lastMeshRebuildAt) > (window.__worldMeshDirty ? 80 : 280)) {
        updateInstancedWorld();
        window.__lastMeshPos.copy(playerPos);
        window.__worldMeshDirty = false;
        window.__lastMeshRebuildAt = nowM;
      }
    }

    // Decoupled Sampling
    frameCounter++;
    const now = performance.now();
    if (now - lastSampleTime >= 500) {
      state.fps = Math.round((frameCounter * 1000) / (now - lastSampleTime));
      state.playerHealthPct = playerHealth;
      state.mobsAlive = aliveMobsCount;
      state.kills = kills;
      frameCounter = 0;
      lastSampleTime = now;
      saveGame();
    }
  };
}, { height: 400 });
</script>
